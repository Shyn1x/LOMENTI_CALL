<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lomenti Call · Сценарии</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,Arial}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#183c29 0%,#0b1110 48%,#080b0a 100%);color:#eaf7ed;min-height:100vh}.wrap{max-width:780px;margin:auto;padding:28px 18px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}.brand{font-size:22px;font-weight:850;letter-spacing:2px;color:#b6ff65;text-shadow:0 0 22px #78ff4870}.sub{color:#91a69a;font-size:13px;margin-top:5px}.lang{background:#17251c;border:1px solid #4c8a54;border-radius:14px;padding:10px;color:white;font-weight:700;cursor:pointer}h1{font-size:clamp(26px,5vw,42px);margin:0 0 8px}.intro{color:#a4b5a8;margin-bottom:26px}.grid{display:grid;gap:13px}.tile,.step{border:1px solid #3e6847;background:linear-gradient(140deg,#1d2b24db,#101813e8);border-radius:20px;padding:20px;box-shadow:0 6px 25px #0005, inset 0 1px #ffffff10}.tile{cursor:pointer;text-align:left;color:#f0fff2;font-size:19px;font-weight:750;transition:.2s}.tile:hover,.choice:hover{border-color:#b4ff69;box-shadow:0 0 22px #a0ff4b22}.tile small{display:block;font-size:13px;color:#9bb39f;margin-top:7px;font-weight:400}.step{margin-top:14px;animation:show .25s ease}.step .eyebrow{color:#a5fb71;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}.step p{font-size:17px;line-height:1.55;margin:10px 0 18px}.choices{display:flex;flex-wrap:wrap;gap:9px}.choice,.back{cursor:pointer;border:1px solid #50755a;background:#23352a;color:#f3fff3;border-radius:12px;padding:11px 15px;font-size:14px;font-weight:700}.choice.active{background:#b5ff69;color:#10200c;border-color:#b5ff69}.back{margin:0 0 22px;background:transparent}.branch{margin-left:12px;padding-left:16px;border-left:2px solid #5d9b59}.note{color:#a4b5a8;font-size:12px;margin-top:22px}@keyframes show{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}@media(max-width:500px){.tile{font-size:17px}.branch{margin-left:4px;padding-left:10px}.step{padding:15px}}</style></head><body><main class="wrap"><header><div><div class="brand">LOMENTI <span style="color:white">CALL</span></div><div class="sub" id="tag">Помощник во время разговора</div></div><button class="lang" id="lang">RU / LV</button></header><div id="app"></div></main><script>
const data={ru:{tag:'Помощник во время разговора',title:'Выбери ситуацию',intro:'Один выбор — один следующий шаг. Ничего лишнего.',home:'← Главное меню',scenarios:[['Нет сайта вообще','У компании нет собственного сайта'],['Сайт уже есть','У компании есть действующий сайт'],['Сайт требует улучшения','Сайт устарел или неудобен']],hello:'Здравствуйте! Я представляю Lomenti. Мы создаём сайты для бизнеса. Удобно сейчас коротко поговорить?',yes:'Да, удобно',no:'Нет, неудобно',notnow:'Понимаю. Спасибо за ваше время. Хорошего дня!',offer0:'Мы можем создать для вашей компании современный сайт, чтобы клиентам было проще находить информацию о ваших услугах. Было бы интересно узнать подробнее?',offer1:'Отлично, что у вас уже есть сайт. Рассматриваете ли вы сейчас его обновление или дополнительные возможности, например AI-чатбот?',offer2:'Мы помогаем улучшать существующие сайты: структуру, внешний вид и удобство для клиентов. Хотели бы обсудить возможные изменения?',interested:'Да, интересно',price:'Сколько стоит?',decline:'Нет, спасибо',declineText:'Понял, спасибо за разговор. Зафиксируем, что предложение сейчас неактуально.',pricing:'Тариф Start — 50 € в месяц, 600 € за первый год (480 € разработка и 120 € поддержка). До 5 страниц и 2 небольшие правки в месяц. Домен и дополнительные интеграции оплачиваются отдельно. Хотели бы получить подробности письменно?',send:'Да, пришлите',later:'Может быть позже',endLead:'Отлично! С вашего разрешения уточним подходящий адрес электронной почты и направим информацию. Наш сайт: lomenti.lv',endLater:'Спасибо! Не будем беспокоить без вашего согласия. Хорошего дня!',question:'Ответ клиента',finish:'Завершение',disclaimer:'Используйте только контакты, разрешённые для обзвона. При отказе прекратите контакт.'},lv:{tag:'Palīgs sarunas laikā',title:'Izvēlieties situāciju',intro:'Viena izvēle — viens nākamais solis.',home:'← Galvenā izvēlne',scenarios:[['Nav mājaslapas','Uzņēmumam nav savas mājaslapas'],['Ir mājaslapa','Uzņēmumam jau ir mājaslapa'],['Mājaslapa jāuzlabo','Esošā mājaslapa ir novecojusi vai neērta']],hello:'Labdien! Es pārstāvu Lomenti. Mēs veidojam mājaslapas uzņēmumiem. Vai jums šobrīd būtu brīdis īsai sarunai?',yes:'Jā, varam',no:'Nē, nav ērti',notnow:'Saprotu. Paldies par jūsu laiku! Lai jauka diena!',offer0:'Mēs varam izveidot jūsu uzņēmumam modernu mājaslapu, lai klientiem būtu vieglāk atrast informāciju par pakalpojumiem. Vai vēlaties uzzināt vairāk?',offer1:'Lieliski, ka jums jau ir mājaslapa. Vai pašlaik apsverat tās atjaunošanu vai papildu iespējas, piemēram, AI čatbotu?',offer2:'Mēs palīdzam uzlabot esošās mājaslapas: struktūru, izskatu un lietošanas ērtumu. Vai būtu interese apspriest uzlabojumus?',interested:'Jā, interesē',price:'Kāda ir cena?',decline:'Nē, paldies',declineText:'Saprotu, paldies par sarunu. Atzīmēsim, ka piedāvājums pašlaik nav aktuāls.',pricing:'Start tarifs — 50 € mēnesī, pirmajā gadā 600 € (480 € izstrāde un 120 € uzturēšana). Līdz 5 lapām un 2 nelielām izmaiņām mēnesī. Domēns un papildu integrācijas nav iekļautas. Vai vēlaties saņemt informāciju rakstiski?',send:'Jā, atsūtiet',later:'Varbūt vēlāk',endLead:'Lieliski! Ar jūsu atļauju precizēsim e-pasta adresi un nosūtīsim informāciju. Mūsu mājaslapa: lomenti.lv',endLater:'Paldies! Bez jūsu piekrišanas netraucēsim. Lai jauka diena!',question:'Klienta atbilde',finish:'Noslēgums',disclaimer:'Zvaniet tikai kontaktiem, kurus atļauts uzrunāt. Atteikuma gadījumā pārtrauciet saziņu.'}};
let language='ru',scenario=null,path=[];
const app=document.getElementById('app');
const t=()=>data[language];
document.getElementById('lang').onclick=()=>{language=language==='ru'?'lv':'ru';document.documentElement.lang=language;render()};
function button(text,fn,active=false){const b=document.createElement('button');b.className='choice'+(active?' active':'');b.textContent=text;b.onclick=fn;return b}
function step(label,phrase,choices,level){const s=document.createElement('section');s.className='step';const e=document.createElement('div');e.className='eyebrow';e.textContent=label;s.append(e);const p=document.createElement('p');p.textContent=phrase;s.append(p);if(choices.length){const c=document.createElement('div');c.className='choices';for(const [text,key] of choices)c.append(button(text,()=>{path=path.slice(0,level);path.push(key);render()},path[level]===key));s.append(c)}return s}
function branch(parent){const b=document.createElement('div');b.className='branch';parent.append(b);return b}
function render(){
 const x=t();document.getElementById('tag').textContent=x.tag;app.replaceChildren();
 if(scenario===null){
  const h=document.createElement('h1');h.textContent=x.title;app.append(h);
  const p=document.createElement('p');p.className='intro';p.textContent=x.intro;app.append(p);
  const g=document.createElement('div');g.className='grid';
  x.scenarios.forEach(([name,desc],i)=>{const b=document.createElement('button');b.className='tile';b.textContent=name;const sm=document.createElement('small');sm.textContent=desc;b.append(sm);b.onclick=()=>{scenario=i;path=[];render()};g.append(b)});
  app.append(g);return;
 }
 const back=button(x.home,()=>{scenario=null;path=[];render()});back.className='back';app.append(back);
 const h=document.createElement('h1');h.textContent=x.scenarios[scenario][0];app.append(h);
 app.append(step('01',x.hello,[[x.yes,'yes'],[x.no,'no']],0));
 if(path[0]){
  const b=branch(app);
  if(path[0]==='no')b.append(step(x.finish,x.notnow,[],1));
  else{
   b.append(step('02',x['offer'+scenario],[[x.interested,'interested'],[x.price,'price'],[x.decline,'decline']],1));
   if(path[1]){
    const c=branch(b);
    if(path[1]==='decline')c.append(step(x.finish,x.declineText,[],2));
    else{
     c.append(step('03',x.pricing,[[x.send,'send'],[x.later,'later'],[x.decline,'decline']],2));
     if(path[2]){
      const d=branch(c);
      d.append(step(x.finish,path[2]==='send'?x.endLead:path[2]==='decline'?x.declineText:x.endLater,[],3));
     }
    }
   }
  }
 }
 const n=document.createElement('div');n.className='note';n.textContent=x.disclaimer;app.append(n);
}
render();</script></body></html>
