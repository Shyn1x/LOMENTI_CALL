<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lomenti Call · Сценарии</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,Arial}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#183c29 0%,#0b1110 48%,#080b0a 100%);color:#eaf7ed;min-height:100vh}.wrap{max-width:780px;margin:auto;padding:28px 18px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}.brand{font-size:22px;font-weight:850;letter-spacing:2px;color:#b6ff65;text-shadow:0 0 22px #78ff4870}.sub{color:#91a69a;font-size:13px;margin-top:5px}.lang{background:#17251c;border:1px solid #4c8a54;border-radius:14px;padding:10px;color:white;font-weight:700;cursor:pointer}h1{font-size:clamp(26px,5vw,42px);margin:0 0 8px}.intro{color:#a4b5a8;margin-bottom:26px}.grid{display:grid;gap:13px}.tile,.step{border:1px solid #3e6847;background:linear-gradient(140deg,#1d2b24db,#101813e8);border-radius:20px;padding:20px;box-shadow:0 6px 25px #0005, inset 0 1px #ffffff10}.tile{cursor:pointer;text-align:left;color:#f0fff2;font-size:19px;font-weight:750;transition:.2s}.tile:hover,.choice:hover{border-color:#b4ff69;box-shadow:0 0 22px #a0ff4b22}.tile small{display:block;font-size:13px;color:#9bb39f;margin-top:7px;font-weight:400}.step{margin-top:14px;animation:show .25s ease}.step .eyebrow{color:#a5fb71;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}.step p{font-size:17px;line-height:1.55;margin:10px 0 18px}.choices{display:flex;flex-wrap:wrap;gap:9px}.choice,.back{cursor:pointer;border:1px solid #50755a;background:#23352a;color:#f3fff3;border-radius:12px;padding:11px 15px;font-size:14px;font-weight:700}.choice.active{background:#b5ff69;color:#10200c;border-color:#b5ff69}.back{margin:0 0 22px;background:transparent}.branch{margin-left:12px;padding-left:16px;border-left:2px solid #5d9b59}.note{color:#eaffd6;font-size:14px;font-weight:750;line-height:1.5;margin-top:22px;padding:16px;border:2px solid #b5ff69;border-radius:14px;background:#172b1c}.safety{position:sticky;top:0;z-index:10;background:#15271cf5;border:2px solid #b5ff69;border-radius:14px;padding:12px 14px;margin-bottom:18px;box-shadow:0 5px 22px #0009;color:#eaffd6;font-size:13px;line-height:1.4;font-weight:800;white-space:pre-line}@keyframes show{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}@media(max-width:500px){.tile{font-size:17px}.branch{margin-left:4px;padding-left:10px}.step{padding:15px}}</style></head><body><main class="wrap"><header><div><div class="brand">LOMENTI <span style="color:white">CALL</span></div><div class="sub" id="tag">Помощник во время разговора</div></div><button class="lang" id="lang">RU / LV</button></header><div class="safety" id="safety" role="note"></div><div id="app"></div></main><script>
const data={ru:{tag:'Помощник во время разговора',title:'Выбери ситуацию',intro:'Один выбор — один следующий шаг. Ничего лишнего.',home:'← Главное меню',scenarios:[['Нет сайта вообще','У компании нет собственного сайта'],['Сайт уже есть','У компании есть действующий сайт'],['Сайт требует улучшения','Сайт устарел или неудобен']],hello:'Здравствуйте! Меня зовут Валдис. Мы занимаемся созданием сайтов для бизнеса. У вас сейчас найдётся минутка с нами поговорить?',yes:'Да, удобно',no:'Нет, неудобно',notnow:'Понимаю. Вам будет удобнее, если мы перезвоним в ближайшее время?',callback:'Да, перезвоните',noCallback:'Нет, спасибо',callbackEnd:'Понимаю. Когда вам будет удобнее перезвонить: сегодня позже или завтра?',today:'Сегодня позже',tomorrow:'Завтра',otherTime:'Другое время',callbackToday:'Хорошо, в какое время сегодня вам будет удобно?',callbackTomorrow:'Хорошо, в какое время завтра вам будет удобно?',callbackOther:'Подскажите, пожалуйста, удобные день и время. Мы согласуем звонок.',selfContact:'Я сам свяжусь',selfContactText:'Спасибо! Чтобы было удобно, могу отправить ссылки на примеры сайтов. Куда удобнее: email, WhatsApp или SMS?',delivery:['Email','WhatsApp','SMS'],deliveryEnd:['На какой email отправить ссылки?','На какой номер WhatsApp можно отправить ссылки?','На какой номер отправить SMS со ссылками?'],noCallbackEnd:'Понимаю. Спасибо за ваше время, хорошего дня!',offer0:'Подскажите, вы сейчас привлекаете клиентов через социальные сети или используете другие способы?',offer1:'Отлично, что у вас уже есть сайт. Рассматриваете ли вы сейчас его обновление или дополнительные возможности, например AI-чатбот?',offer2:'Мы помогаем улучшать существующие сайты: структуру, внешний вид и удобство для клиентов. Хотели бы обсудить возможные изменения?',interested:'Да, интересно',price:'Сколько стоит?',decline:'Нет, спасибо',declineText:'Понял, спасибо за разговор. Зафиксируем, что предложение сейчас неактуально.',pricing:'Тариф Start — 50 € в месяц, 600 € за первый год (480 € разработка и 120 € поддержка). До 5 страниц и 2 небольшие правки в месяц. Домен и дополнительные интеграции оплачиваются отдельно. Хотели бы получить подробности письменно?',send:'Да, пришлите',askPrice:'Сколько стоит?',later:'Может быть позже',endLead:'Отлично! На какой адрес электронной почты вам удобно получить ссылки на примеры сайтов? Отправим, чтобы вы могли спокойно ознакомиться.',endLater:'Спасибо! Не будем беспокоить без вашего согласия. Хорошего дня!',channels:['Через социальные сети','По рекомендациям','Через рекламу','Пока никак'],channelReplies:['Понимаю. А бывает, что клиентам сложно найти всю информацию о ваших услугах в соцсетях?','Отлично, рекомендации важны. А хотелось бы, чтобы новые клиенты могли самостоятельно найти вас и узнать об услугах?','Понятно. А куда попадают люди после вашей рекламы, чтобы узнать подробнее об услугах?','Понимаю. А хотели бы вы, чтобы потенциальные клиенты могли находить информацию о компании в интернете?'],continueLabel:'Да, это актуально',notRelevant:'Нет, не актуально',discoveryNext:'Сейчас сайт — удобный способ представить бизнес в интернете: в одном месте клиент увидит услуги, цены, контакты и ответы на частые вопросы. Мы создаём такие сайты для компаний. Можем отправить вам ссылки на примеры наших работ, чтобы вы спокойно ознакомились. Вам было бы интересно?',question:'Ответ клиента',finish:'Завершение',disclaimer:'ВАЖНО: ЗВОНИТЬ ТОЛЬКО ПО ПРОВЕРЕННЫМ КОРПОРАТИВНЫМ КОНТАКТАМ С ПОДТВЕРЖДЁННЫМ ОСНОВАНИЕМ ДЛЯ ЗВОНКА. НЕ ЗВОНИТЬ НА ЛИЧНЫЕ И НЕПОДТВЕРЖДЁННЫЕ МОБИЛЬНЫЕ НОМЕРА. ОТСУТСТВИЕ ОТКАЗА НЕ ОЗНАЧАЕТ СОГЛАСИЯ. ПРЕДСТАВИТЬСЯ И НАЗВАТЬ КОМПАНИЮ ПО ЗАПРОСУ. ПРИ ОТКАЗЕ — СРАЗУ ЗАВЕРШИТЬ РАЗГОВОР, ЗАФИКСИРОВАТЬ ОТКАЗ И НЕ ЗВОНИТЬ ПОВТОРНО. НЕ ОБЕЩАТЬ ГАРАНТИРОВАННЫЕ ПРОДАЖИ И НЕ НАЗЫВАТЬ ЦЕНУ БЕЗ ВОПРОСА.'},lv:{tag:'Palīgs sarunas laikā',title:'Izvēlieties situāciju',intro:'Viena izvēle — viens nākamais solis.',home:'← Galvenā izvēlne',scenarios:[['Nav mājaslapas','Uzņēmumam nav savas mājaslapas'],['Ir mājaslapa','Uzņēmumam jau ir mājaslapa'],['Mājaslapa jāuzlabo','Esošā mājaslapa ir novecojusi vai neērta']],hello:'Labdien! Mani sauc Valdis. Mēs nodarbojamies ar mājaslapu izstrādi uzņēmumiem. Vai jums šobrīd atrastos minūtīte sarunai ar mums?',yes:'Jā, varam',no:'Nē, nav ērti',notnow:'Saprotu. Vai jums būtu ērtāk, ja mēs tuvākajā laikā atzvanītu?',callback:'Jā, atzvaniet',noCallback:'Nē, paldies',callbackEnd:'Saprotu. Kad jums būtu ērtāk saņemt zvanu: vēlāk šodien vai rīt?',today:'Vēlāk šodien',tomorrow:'Rīt',otherTime:'Citā laikā',callbackToday:'Labi, cikos šodien jums būtu ērti?',callbackTomorrow:'Labi, cikos rīt jums būtu ērti?',callbackOther:'Sakiet, lūdzu, kurā dienā un laikā jums būtu ērti. Vienosimies par zvanu.',selfContact:'Es pats sazināšos',selfContactText:'Paldies! Varu nosūtīt saites uz mājaslapu piemēriem, lai jums būtu ērtāk. Kur labāk nosūtīt: e-pastā, WhatsApp vai SMS?',delivery:['E-pasts','WhatsApp','SMS'],deliveryEnd:['Uz kuru e-pasta adresi nosūtīt saites?','Uz kuru WhatsApp numuru nosūtīt saites?','Uz kuru numuru nosūtīt SMS ar saitēm?'],noCallbackEnd:'Saprotu. Paldies par jūsu laiku! Lai jauka diena!',offer0:'Sakiet, lūdzu, vai jūs pašlaik piesaistāt klientus ar sociālo tīklu palīdzību vai izmantojat citus veidus?',offer1:'Lieliski, ka jums jau ir mājaslapa. Vai pašlaik apsverat tās atjaunošanu vai papildu iespējas, piemēram, AI čatbotu?',offer2:'Mēs palīdzam uzlabot esošās mājaslapas: struktūru, izskatu un lietošanas ērtumu. Vai būtu interese apspriest uzlabojumus?',interested:'Jā, interesē',price:'Kāda ir cena?',decline:'Nē, paldies',declineText:'Saprotu, paldies par sarunu. Atzīmēsim, ka piedāvājums pašlaik nav aktuāls.',pricing:'Start tarifs — 50 € mēnesī, pirmajā gadā 600 € (480 € izstrāde un 120 € uzturēšana). Līdz 5 lapām un 2 nelielām izmaiņām mēnesī. Domēns un papildu integrācijas nav iekļautas. Vai vēlaties saņemt informāciju rakstiski?',send:'Jā, atsūtiet',askPrice:'Cik tas maksā?',later:'Varbūt vēlāk',endLead:'Lieliski! Uz kuru e-pasta adresi jums būtu ērti saņemt saites uz mājaslapu piemēriem? Nosūtīsim, lai varat mierīgi iepazīties.',endLater:'Paldies! Bez jūsu piekrišanas netraucēsim. Lai jauka diena!',channels:['Sociālajos tīklos','Pēc ieteikumiem','Ar reklāmu','Pagaidām nekā'],channelReplies:['Saprotu. Vai klientiem dažkārt ir grūti sociālajos tīklos atrast visu informāciju par jūsu pakalpojumiem?','Lieliski, ieteikumi ir svarīgi. Vai vēlaties, lai arī jauni klienti varētu jūs atrast un iepazīties ar pakalpojumiem?','Skaidrs. Kur cilvēki pēc reklāmas var uzzināt vairāk par jūsu pakalpojumiem?','Saprotu. Vai vēlaties, lai potenciālie klienti varētu atrast informāciju par jūsu uzņēmumu internetā?'],continueLabel:'Jā, tas ir aktuāli',notRelevant:'Nē, nav aktuāli',discoveryNext:'Mājaslapa ir ērts veids, kā iepazīstināt ar uzņēmumu internetā: vienuviet klienti var atrast pakalpojumus, cenas, kontaktus un atbildes uz jautājumiem. Mēs veidojam šādas mājaslapas uzņēmumiem. Varam nosūtīt saites uz mūsu darbu piemēriem, lai jūs varētu mierīgi iepazīties. Vai tas jūs interesētu?',question:'Klienta atbilde',finish:'Noslēgums',disclaimer:'SVARĪGI: ZVANĪT TIKAI PĀRBAUDĪTIEM UZŅĒMUMU KONTAKTIEM AR APSTIPRINĀTU PAMATU ZVANAM. NEZVANĪT UZ PRIVĀTIEM VAI NEAPSTIPRINĀTIEM MOBILAJIEM NUMURIEM. ATTEIKUMA NEESAMĪBA NAV PIEKRIŠANA. PĒC PIEPRASĪJUMA NOSAUKT SAVU VĀRDU UN UZŅĒMUMU. ATTEIKUMA GADĪJUMĀ NEKAVĒJOTIES BEIGT SARUNU, FIKSĒT ATTEIKUMU UN VAIRS NEZVANĪT. NESOLĪT GARANTĒTU PĀRDOŠANAS REZULTĀTU UN NENOSAUKT CENU, JA KLIENTS TO NAV JAUTĀJIS.'}};
let language='ru',scenario=null,path=[];
const app=document.getElementById('app');
const t=()=>data[language];
document.getElementById('lang').onclick=()=>{language=language==='ru'?'lv':'ru';document.documentElement.lang=language;render()};
function button(text,fn,active=false){const b=document.createElement('button');b.className='choice'+(active?' active':'');b.textContent=text;b.onclick=fn;return b}
function step(label,phrase,choices,level){const s=document.createElement('section');s.className='step';const e=document.createElement('div');e.className='eyebrow';e.textContent=label;s.append(e);const p=document.createElement('p');p.textContent=phrase;s.append(p);if(choices.length){const c=document.createElement('div');c.className='choices';for(const [text,key] of choices)c.append(button(text,()=>{path=path.slice(0,level);path.push(key);render()},path[level]===key));s.append(c)}return s}
function branch(parent){const b=document.createElement('div');b.className='branch';parent.append(b);return b}
function render(){
 const x=t();document.getElementById('tag').textContent=x.tag;document.getElementById('safety').textContent=x.disclaimer;app.replaceChildren();
 if(scenario===null){
  const h=document.createElement('h1');h.textContent=x.title;app.append(h);
  const p=document.createElement('p');p.className='intro';p.textContent=x.intro;app.append(p);
  const g=document.createElement('div');g.className='grid';
  x.scenarios.forEach(([name,desc],i)=>{const b=document.createElement('button');b.className='tile';b.textContent=name;const sm=document.createElement('small');sm.textContent=desc;b.append(sm);b.onclick=()=>{scenario=i;path=[];render()};g.append(b)});
  app.append(g);return;
 }
 const back=button(x.home,()=>{scenario=null;path=[];render()});back.className='back';app.append(back);
 const h=document.createElement('h1');h.textContent=x.scenarios[scenario][0];app.append(h);
 app.append(step('01',x.hello,[[x.yes,'yes'],[x.no,'no']],0));
 if(path[0]){
  const b=branch(app);
  if(path[0]==='no'){b.append(step('02',x.notnow,[[x.callback,'callback'],[x.selfContact,'selfContact'],[x.noCallback,'noCallback']],1));if(path[1]){const c=branch(b);if(path[1]==='callback'){c.append(step('03',x.callbackEnd,[[x.today,'today'],[x.tomorrow,'tomorrow'],[x.otherTime,'otherTime'],[x.selfContact,'selfContact']],2));if(path[2]){const d=branch(c);d.append(step(x.finish,path[2]==='today'?x.callbackToday:path[2]==='tomorrow'?x.callbackTomorrow:path[2]==='otherTime'?x.callbackOther:x.selfContactText,path[2]==='selfContact'?x.delivery.map((v,i)=>[v,'delivery'+i]):[],3));if(path[3]&&path[2]==='selfContact'){const e=branch(d);e.append(step(x.finish,x.deliveryEnd[Number(path[3].slice(8))],[],4))}}}else if(path[1]==='selfContact'){c.append(step('03',x.selfContactText,x.delivery.map((v,i)=>[v,'delivery'+i]),2));if(path[2]){const d=branch(c);d.append(step(x.finish,x.deliveryEnd[Number(path[2].slice(8))],[],3))}}else c.append(step(x.finish,x.noCallbackEnd,[],2))}}
  else{
   if(scenario===0){
    b.append(step('02',x.offer0,x.channels.map((v,i)=>[v,'channel'+i]),1));
   }else{
    b.append(step('02',x['offer'+scenario],[[x.interested,'interested'],[x.price,'price'],[x.decline,'decline']],1));
   }
   if(path[1]){
    const c=branch(b);
    if(scenario===0 && path[1].startsWith('channel')){
     const idx=Number(path[1].slice(7));
     c.append(step('03',x.channelReplies[idx],[[x.continueLabel,'interested'],[x.notRelevant,'decline']],2));
     if(path[2]){
      const d=branch(c);
      if(path[2]==='decline')d.append(step(x.finish,x.declineText,[],3));
      else{
       d.append(step('04',x.discoveryNext,[[x.send,'send'],[x.askPrice,'price'],[x.later,'later'],[x.decline,'decline']],3));
       if(path[3]){
        const e=branch(d);
        if(path[3]==='price'){e.append(step('05',x.pricing,[[x.send,'send'],[x.decline,'decline']],4));if(path[4]){const f=branch(e);f.append(step(x.finish,path[4]==='send'?x.endLead:x.declineText,[],5))}}else e.append(step(x.finish,path[3]==='send'?x.endLead:path[3]==='decline'?x.declineText:x.endLater,[],4));
       }
      }
     }
    }else if(path[1]==='decline')c.append(step(x.finish,x.declineText,[],2));
    else{
     c.append(step('03',x.pricing,[[x.send,'send'],[x.later,'later'],[x.decline,'decline']],2));
     if(path[2]){
      const d=branch(c);
      d.append(step(x.finish,path[2]==='send'?x.endLead:path[2]==='decline'?x.declineText:x.endLater,[],3));
     }
    }
   }
  }
 }
 const n=document.createElement('div');n.className='note';n.textContent=x.disclaimer;app.append(n);
}
render();</script></body></html>
