let language='ru',scenario=null,path=[];
const app=document.getElementById('app');
const t=()=>data[language];
document.getElementById('lang').onclick=()=>{language=language==='ru'?'lv':'ru';document.documentElement.lang=language;render()};
function button(text,fn,active=false){const b=document.createElement('button');b.className='choice'+(active?' active':'');b.textContent=text;b.onclick=fn;return b}
function step(label,phrase,choices,level){const s=document.createElement('section');s.className='step';const e=document.createElement('div');e.className='eyebrow';e.textContent=label;s.append(e);const p=document.createElement('p');p.textContent=phrase;s.append(p);if(choices.length){const c=document.createElement('div');c.className='choices';for(const [text,key] of choices)c.append(button(text,()=>{path=path.slice(0,level);path.push(key);render()},path[level]===key));s.append(c)}return s}
function branch(parent){const b=document.createElement('div');b.className='branch';parent.append(b);return b}
function render(){
 const x=t();document.getElementById('tag').textContent=x.tag;{const safety=document.getElementById('safety');safety.replaceChildren();const title=document.createElement('div');title.className='safety-title';title.textContent=lang==='ru'?'ВАЖНО · ПАМЯТКА ВАЛДИСУ':'SVARĪGI · ATGĀDNE VALDIM';const grid=document.createElement('div');grid.className='safety-grid';const parts=x.disclaimer.replace(/^ВАЖНО: |^SVARĪGI: /,'').split(/\. (?=[А-ЯЁA-ZĀČĒĢĪĶĻŅŠŪŽ])/).filter(Boolean);for(const part of parts){const item=document.createElement('div');item.className='safety-item';item.textContent=part.trim();grid.append(item)}safety.append(title,grid)}app.replaceChildren();
 if(scenario===null){
  const h=document.createElement('h1');h.textContent=x.title;app.append(h);
  const p=document.createElement('p');p.className='intro';p.textContent=x.intro;app.append(p);
  const g=document.createElement('div');g.className='grid';
  x.scenarios.forEach(([name,desc],i)=>{const b=document.createElement('button');b.className='tile';b.textContent=name;const sm=document.createElement('small');sm.textContent=desc;b.append(sm);b.onclick=()=>{scenario=i;path=[];render()};g.append(b)});
  app.append(g);return;
 }
 const back=button(x.home,()=>{scenario=null;path=[];render()});back.className='back';app.append(back);
 const h=document.createElement('h1');h.textContent=x.scenarios[scenario][0];app.append(h);
 app.append(step('01',x.hello,[[x.yes,'yes'],[x.no,'no']],0));
 if(path[0]){
  const b=branch(app);
  if(path[0]==='no'){b.append(step('02',x.notnow,[[x.callback,'callback'],[x.selfContact,'selfContact'],[x.noCallback,'noCallback']],1));if(path[1]){const c=branch(b);if(path[1]==='callback'){c.append(step('03',x.callbackEnd,[[x.today,'today'],[x.tomorrow,'tomorrow'],[x.otherTime,'otherTime'],[x.selfContact,'selfContact']],2));if(path[2]){const d=branch(c);d.append(step(x.finish,path[2]==='today'?x.callbackToday:path[2]==='tomorrow'?x.callbackTomorrow:path[2]==='otherTime'?x.callbackOther:x.selfContactText,path[2]==='selfContact'?x.delivery.map((v,i)=>[v,'delivery'+i]):[],3));if(path[3]&&path[2]==='selfContact'){const e=branch(d);e.append(step(x.finish,x.deliveryEnd[Number(path[3].slice(8))],[],4))}}}else if(path[1]==='selfContact'){c.append(step('03',x.selfContactText,x.delivery.map((v,i)=>[v,'delivery'+i]),2));if(path[2]){const d=branch(c);d.append(step(x.finish,x.deliveryEnd[Number(path[2].slice(8))],[],3))}}else c.append(step(x.finish,x.noCallbackEnd,[],2))}}
  else{
   if(scenario===0){
    b.append(step('02',x.offer0,x.channels.map((v,i)=>[v,'channel'+i]),1));
   }else{
    b.append(step('02',x['offer'+scenario],[[x.interested,'interested'],[x.price,'price'],[x.decline,'decline']],1));
   }
   if(path[1]){
    const c=branch(b);
    if(scenario===0 && path[1]==='channel0'){
     c.append(step('03',x.socialQuestion,x.socialOptions.map((v,i)=>[v,'social'+i]),2));
     if(path[2]){
      const d=branch(c),n=Number(path[2].slice(6));
      if(n===0)d.append(step('04',x.socialEnough,x.socialExamplesOptions.map((v,i)=>[v,'answer'+i]),3));
      else if(n===1)d.append(step('04',x.socialMore,x.socialMoreOptions.map((v,i)=>[v,'detail'+i]),3));
      else d.append(step('04',x.socialMixed,x.socialMixedOptions.map((v,i)=>[v,'detail'+i]),3));
      if(path[3]){
       const e=branch(d);
       if(path[3].startsWith('detail')){
        const k=Number(path[3].slice(6)),line=n===1?x.socialMoreTexts[k]:x.socialMixedTexts[k];
        e.append(step('05',line+' '+x.socialExamples,x.socialExamplesOptions.map((v,i)=>[v,'answer'+i]),4));
       }else if(path[3]==='answer0')e.append(step('05',x.selfContactText,x.delivery.map((v,i)=>[v,'delivery'+i]),4));
       else if(path[3]==='answer1')e.append(step('05',x.socialNoNeed,x.needChoices.map((v,i)=>[v,'need'+i]),4));
       else e.append(step('05',x.socialLater,x.recommendLaterChoices.map((v,i)=>[v,'reason'+i]),4));
       const level=path[3].startsWith('detail')?4:3;
       if(path[level]){
        const f=branch(e),answer=path[level];
        if(answer==='answer0')f.append(step('06',x.selfContactText,x.delivery.map((v,i)=>[v,'delivery'+i]),level+1));
        else if(answer==='answer1')f.append(step('06',x.socialNoNeed,x.needChoices.map((v,i)=>[v,'need'+i]),level+1));
        else if(answer==='answer2')f.append(step('06',x.socialLater,x.recommendLaterChoices.map((v,i)=>[v,'reason'+i]),level+1));
        else if(answer.startsWith('reason'))f.append(step('06',answer==='reason0'?x.socialNoNeed:x.recommendNotNow,answer==='reason1'?x.recommendPermission.map((v,i)=>[v,'permit'+i]):x.needChoices.map((v,i)=>[v,'need'+i]),level+1));
        else if(answer.startsWith('delivery'))f.append(step(x.finish,x.deliveryEnd[Number(answer.slice(8))],[],level+1));
        else if(answer==='stop')f.append(step(x.finish,x.declineText,[],level+1));
        if(path[level+1]){const g=branch(f),v=path[level+1];if(v.startsWith('delivery'))g.append(step(x.finish,x.deliveryEnd[Number(v.slice(8))],[],level+2));else if(v.startsWith('reason'))g.append(step('07',v==='reason0'?x.socialNoNeed:x.recommendNotNow,v==='reason1'?x.recommendPermission.map((q,i)=>[q,'permit'+i]):x.needChoices.map((q,i)=>[q,'need'+i]),level+2));else if(v==='permit0')g.append(step(x.finish,x.recommendSms,[],level+2));else g.append(step(x.finish,x.declineText,[],level+2));if(path[level+2]){const h=branch(g);h.append(step(x.finish,path[level+2]==='permit0'?x.recommendSms:x.declineText,[],level+3))}}
       }
      }
     }
    }else if(scenario===0 && path[1]==='channel1'){
     c.append(step('03',x.recommendQuestion,x.recommendChoices.map((v,i)=>[v,'rec'+i]),2));
     if(path[2]){
      const d=branch(c);
      if(path[2]==='rec1')d.append(step(x.finish,x.recommendNo,[],3));
      else{
       const unsure=path[2]==='rec2';
       d.append(step('04',unsure?x.recommendUnsure:x.recommendYes,unsure?[[x.continueLabel,'continue'],[x.notRelevant,'decline']]:x.recommendOffer.map((v,i)=>[v,'offer'+i]),3));
       const offer=(parent,level,choice)=>{
        if(choice==='offer2'||choice==='decline'){parent.append(step(x.finish,x.declineText,[],level));return}
        if(choice==='offer0'){parent.append(step(x.finish,x.selfContactText,x.delivery.map((v,i)=>[v,'delivery'+i]),level));return}
        if(choice==='offer1'){parent.append(step('05',x.recommendLater,x.recommendLaterChoices.map((v,i)=>[v,'reason'+i]),level));return}
       };
       if(path[3]){
        const e=branch(d);
        if(unsure&&path[3]==='continue'){
         e.append(step('05',x.recommendUnsureNext,x.recommendOffer.map((v,i)=>[v,'offer'+i]),4));
         if(path[4]){const f=branch(e);offer(f,5,path[4]);if(path[4]==='offer0'&&path[5]){const g=branch(f);g.append(step(x.finish,x.deliveryEnd[Number(path[5].slice(8))],[],6))}if(path[4]==='offer1'&&path[5]){const g=branch(f);g.append(step('06',path[5]==='reason0'?x.recommendNotNeeded:x.recommendNotNow,path[5]==='reason1'?x.recommendPermission.map((v,i)=>[v,'permit'+i]):x.needChoices.map((v,i)=>[v,'need'+i]),6));if(path[6]){const h=branch(g);h.append(step(x.finish,path[6]==='permit0'?x.recommendSms:x.declineText,[],7))}}}
        }else{
         offer(e,4,unsure?'decline':path[3]);
         if(!unsure&&path[3]==='offer0'&&path[4]){const f=branch(e);f.append(step(x.finish,x.deliveryEnd[Number(path[4].slice(8))],[],5))}
         if(!unsure&&path[3]==='offer1'&&path[4]){const f=branch(e);f.append(step('06',path[4]==='reason0'?x.recommendNotNeeded:x.recommendNotNow,path[4]==='reason1'?x.recommendPermission.map((v,i)=>[v,'permit'+i]):x.needChoices.map((v,i)=>[v,'need'+i]),5));if(path[5]){const g=branch(f);g.append(step(x.finish,path[5]==='permit0'?x.recommendSms:x.declineText,[],6))}}
        }
       }
      }
     }
    }else if(scenario===0 && path[1].startsWith('channel')){
     const idx=Number(path[1].slice(7));
     c.append(step('03',x.channelReplies[idx],[[x.continueLabel,'interested'],[x.notRelevant,'decline']],2));
     if(path[2]){
      const d=branch(c);
      if(path[2]==='decline'){
       d.append(step('04',x.recommendLater,x.recommendLaterChoices.map((v,i)=>[v,'reason'+i]),3));
       if(path[3]){const e=branch(d);e.append(step('05',path[3]==='reason0'?x.recommendNotNeeded:x.recommendNotNow,path[3]==='reason1'?x.recommendPermission.map((v,i)=>[v,'permit'+i]):[[x.decline,'stop']],4));if(path[4]){const f=branch(e);f.append(step(x.finish,path[4]==='permit0'?x.recommendSms:x.declineText,[],5))}}
      }
      else{
       d.append(step('04',x.discoveryNext,[[x.send,'send'],[x.askPrice,'price'],[x.later,'later'],[x.decline,'decline']],3));
       if(path[3]){
        const e=branch(d);
        if(path[3]==='price'){e.append(step('05',x.pricing,[[x.send,'send'],[x.decline,'decline']],4));if(path[4]){const f=branch(e);f.append(step(x.finish,path[4]==='send'?x.endLead:x.declineText,[],5))}}else e.append(step(x.finish,path[3]==='send'?x.endLead:path[3]==='decline'?x.declineText:x.endLater,[],4));
       }
      }
     }
    }else if(path[1]==='decline')c.append(step(x.finish,x.declineText,[],2));
    else{
     c.append(step('03',x.pricing,[[x.send,'send'],[x.later,'later'],[x.decline,'decline']],2));
     if(path[2]){
      const d=branch(c);
      d.append(step(x.finish,path[2]==='send'?x.endLead:path[2]==='decline'?x.declineText:x.endLater,[],3));
     }
    }
   }
  }
 }

}
