/* Larger entire notes panel, not only the typing area */
.call-notes{padding:22px!important;min-height:430px;border-radius:24px!important;display:flex;flex-direction:column;gap:9px}
.call-notes .notes-head{min-height:45px}
.call-notes label{font-size:16px!important}
.call-notes textarea{flex:1;min-height:300px!important;height:340px;resize:vertical;font-size:15px;line-height:1.6;padding:15px!important}
.call-notes.collapsed{min-height:0;display:block}
.call-notes.collapsed textarea{display:none}
@media(min-width:1500px){
 .wrap{width:calc(100% - 760px);max-width:840px}
 .call-notes{width:350px!important;right:16px;min-height:510px}
 .call-notes textarea{min-height:350px!important;height:390px}
}
@media(min-width:1100px) and (max-width:1499px){.call-notes{width:100%!important;max-width:920px;min-height:460px}}
@media(max-width:1099px){.call-notes{width:100%;min-height:400px}.call-notes textarea{height:300px;min-height:275px!important}}
@media(max-width:600px){.call-notes{padding:17px!important;min-height:350px}.call-notes textarea{height:260px;min-height:245px!important}}

/* Darker backdrop: retain subtle green atmosphere, reduce overall brightness */
html{background:#070c09!important}
body{background:radial-gradient(ellipse 75% 55% at 15% 0%,rgba(29,69,37,.15),transparent 75%),radial-gradient(ellipse 65% 50% at 94% 88%,rgba(25,65,37,.10),transparent 80%),linear-gradient(160deg,#080e0b 0%,#0b1510 50%,#070d0a 100%)!important;background-attachment:fixed!important}
body::before{background:none!important;opacity:0!important}
body::after{background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.24))!important}

/* Small persistent action and a clear note-retention message */
.header-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.new-call{border-radius:999px;padding:10px 15px;background:linear-gradient(120deg,#294833,#172e27);color:#ecffed;border:1px solid #97d9a6;box-shadow:inset 0 1px #ffffff55,0 3px 12px #0005;cursor:pointer;font:700 13px system-ui;white-space:nowrap;transition:filter .25s ease,transform .25s ease}
.new-call:hover{filter:brightness(1.18);transform:translateY(-1px)}
.new-call:focus-visible{outline:2px solid #d5ffab;outline-offset:3px}
.notes-session-hint{font-size:11px;line-height:1.5;color:#cce8d1;margin:0 0 8px}
@media(max-width:540px){.header-actions{gap:6px}.new-call{padding:9px 10px;font-size:11px}.lang{padding:9px 10px;font-size:11px}.notes-session-hint{font-size:11px}}

.call-notes.collapsed .notes-session-hint{display:none}

      if(path[3]&&path[2]==='send'){const e=branch(d);e.append(step(x.finish,x.deliveryEnd[Number(path[3].slice(8))],[],4))}
     }
    }else if(scenario===2){
     const ru=language==='ru',a=(r,l)=>ru?r:l;
     const bye=a('Спасибо за разговор! Не буду отвлекать. Хорошего дня!','Paldies par sarunu! Netraucēšu. Lai jauka diena!');
     c.append(step('03',a('Что сейчас больше всего мешает вашему сайту?','Kas šobrīd visvairāk traucē jūsu mājaslapai?'),[
      [a('Устаревший дизайн','Novecojis dizains'),'design'],
      [a('Неудобно с телефона','Neērti telefonā'),'mobile'],
      [a('Мало заявок','Maz pieteikumu'),'leads'],
      [a('Сложно обновлять','Grūti atjaunot'),'updates'],
      [a('Не знаю точно','Nezinu precīzi'),'unknown'],
      [x.decline,'stop']
     ],2));
     if(path[2]){
      const d=branch(c),v=path[2];
      if(v==='stop')d.append(step(x.finish,bye,[],3));
      else {
       const prompts={
        design:a('Что хотелось бы изменить в первую очередь: внешний вид или структуру страниц?','Ko vispirms vēlētos mainīt: izskatu vai lapu struktūru?'),
        mobile:a('Что неудобнее всего на телефоне: читать информацию, искать контакты или отправлять заявку?','Kas telefonā ir visneērtāk: lasīt informāciju, atrast kontaktus vai nosūtīt pieteikumu?'),
        leads:a('Клиенты чаще звонят или оставляют заявки через сайт?','Vai klienti biežāk zvana vai piesakās mājaslapā?'),
        updates:a('Что сложнее обновлять: цены, услуги или фотографии?','Ko ir grūtāk atjaunot: cenas, pakalpojumus vai fotoattēlus?'),
        unknown:a('Можем начать с короткого обзора сайта в удобное время. Это было бы полезно?','Varam sākt ar īsu mājaslapas apskatu sev ērtā laikā. Vai tas būtu noderīgi?')
       };
       d.append(step('04',prompts[v],[
        [a('Да, обсудим','Jā, apspriedīsim'),'discuss'],
        [a('Пока не актуально','Pagaidām nav aktuāli'),'later'],
        [x.decline,'stop']
       ],3));
       if(path[3]){
        const e=branch(d);
        if(path[3]!=='discuss')e.append(step(x.finish,bye,[],4));
        else {
         e.append(step('05',a('Понял. Можем предложить улучшение именно этой части сайта. Хотите, чтобы мы прислали примеры и предварительный вариант решения?','Sapratu. Varam piedāvāt uzlabot tieši šo mājaslapas daļu. Vai vēlaties saņemt piemērus un sākotnējo risinājumu?'),[
          [a('Да, отправьте','Jā, atsūtiet'),'yes'],
          [a('Сколько стоит?','Cik maksā?'),'price'],
          [a('Есть свой разработчик','Ir savs izstrādātājs'),'developer'],
          [x.decline,'stop']
         ],4));
         if(path[4]){
          const f=branch(e),w=path[4];
          if(w==='yes')f.append(step('06',x.selfContactText,x.delivery.map((v,i)=>[v,'delivery'+i]),5));
          else if(w==='price'||w==='developer')f.append(step('06',w==='price'?a('Стоимость зависит от объёма: можно начать с одной конкретной доработки. Сначала оценим задачу, в удобное время. Отправить примеры?','Cena ir atkarīga no darba apjoma: var sākt ar vienu konkrētu uzlabojumu. Vispirms izvērtēsim uzdevumu sev ērtā laikā. Vai nosūtīt piemērus?'):a('Отлично. Не предлагаем заменять вашего разработчика. При необходимости можем помочь с отдельной задачей. Отправить примеры?','Lieliski. Mēs nepiedāvājam aizstāt jūsu izstrādātāju. Vajadzības gadījumā varam palīdzēt ar atsevišķu uzdevumu. Vai nosūtīt piemērus?'),[[x.send,'send'],[x.decline,'stop']],5));
          else f.append(step(x.finish,bye,[],5));
          if(path[5]){
           const g=branch(f);
           if(w==='yes'&&path[5].startsWith('delivery'))g.append(step(x.finish,x.deliveryEnd[Number(path[5].slice(8))],[],6));
           else if(path[5]==='send')g.append(step('07',x.selfContactText,x.delivery.map((v,i)=>[v,'delivery'+i]),6));
           else g.append(step(x.finish,bye,[],6));
           if(path[6]&&path[5]==='send'&&path[6].startsWith('delivery')){
            const h=branch(g);h.append(step(x.finish,x.deliveryEnd[Number(path[6].slice(8))],[],7));
           }
          }
         }
        }
       }
      }
     }
    }else if(path[1]==='decline')c.append(step(x.finish,x.declineText,[],2));
    else{
     c.append(step('03',x.pricing,[[x.send,'send'],[x.later,'later'],[x.decline,'decline']],2));
     if(path[2]){
      const d=branch(c);
      d.append(step(x.finish,path[2]==='send'?x.endLead:path[2]==='decline'?x.declineText:x.endLater,[],3));
     }
    }
   }
  }
 }
 updateCallProgress();
}

(function(){const box=document.getElementById('safety');let active=null;box.addEventListener('pointerdown',e=>{if(!e.target.closest('.safety-drag-handle')||e.button!==0 )return;const rect=box.getBoundingClientRect();box.style.position='fixed';box.style.left=rect.left+'px';box.style.top=rect.top+'px';box.style.right='auto';active={id:e.pointerId,dx:e.clientX-rect.left,dy:e.clientY-rect.top};e.target.setPointerCapture(e.pointerId);box.classList.add('dragging')});box.addEventListener('pointermove',e=>{if(!active||active.id!==e.pointerId)return;box.style.left=Math.max(0,Math.min(Math.max(0,innerWidth-box.offsetWidth),e.clientX-active.dx))+'px';box.style.top=Math.max(0,Math.min(Math.max(0,innerHeight-50),e.clientY-active.dy))+'px'});function done(e){if(!active||active.id!==e.pointerId)return;active=null;box.classList.remove('dragging');try{localStorage.setItem('lomenti-call-safety-position',JSON.stringify({x:box.offsetLeft/innerWidth,y:box.offsetTop/innerHeight}))}catch{}}box.addEventListener('pointerup',done);box.addEventListener('pointercancel',done);try{const p=JSON.parse(localStorage.getItem('lomenti-call-safety-position')||'null');if(p){box.style.position='fixed';box.style.right='auto';box.style.left=Math.max(0,Math.min(Math.max(0,innerWidth-box.offsetWidth),p.x*innerWidth))+'px';box.style.top=Math.max(0,Math.min(innerHeight-50,p.y*innerHeight))+'px'}}catch{}})();
